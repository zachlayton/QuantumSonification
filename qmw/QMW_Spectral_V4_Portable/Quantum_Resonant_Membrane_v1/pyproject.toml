[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qmw-quantum-resonant-membrane"
version = "1.0.0"
description = "Standalone density-to-resonant-membrane SuperCollider instrument"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "python-osc>=1.8.3,<2"]

[tool.setuptools]
packages = ["quantum_resonant_membrane"]
