&lt;script&gt;
(() =&gt; {
  const root = document.getElementById('bloch-harmonics-demo');
  const thetaInput = root.querySelector('#bh-theta');
  const phiInput = root.querySelector('#bh-phi');
  const thetaValue = root.querySelector('#bh-theta-value');
  const phiValue = root.querySelector('#bh-phi-value');
  const vector = root.querySelector('#bh-vector');
  const point = root.querySelector('#bh-point');
  const xyzText = root.querySelector('#bh-vector-values');
  const barsGroup = root.querySelector('#bh-bars');
  const ns = 'http://www.w3.org/2000/svg';

  const channels = [];
  for (let l = 1; l &lt;= 3; l++) {
    channels.push({ l, m: 0, kind: '', label: `Y_${l}_0` });
    for (let m = 1; m &lt;= l; m++) {
      channels.push({ l, m, kind: 'c', label: `Y_${l}_${m}c` });
      channels.push({ l, m, kind: 's', label: `Y_${l}_${m}s` });
    }
  }

  function factorial(n) {
    let result = 1;
    for (let i = 2; i &lt;= n; i++) result *= i;
    return result;
  }

  function associatedLegendre(l, m, x) {
    let pmm = 1;
    if (m &gt; 0) {
      const somx2 = Math.sqrt(Math.max(0, 1 - x * x));
      let fact = 1;
      for (let i = 1; i &lt;= m; i++) {
        pmm *= -fact * somx2;
        fact += 2;
      }
    }
    if (l === m) return pmm;
    let pmmp1 = x * (2 * m + 1) * pmm;
    if (l === m + 1) return pmmp1;
    let pll = 0;
    for (let ll = m + 2; ll &lt;= l; ll++) {
      pll = ((2 * ll - 1) * x * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
      pmm = pmmp1;
      pmmp1 = pll;
    }
    return pll;
  }

  function realY(channel, theta, phi) {
    const { l, m, kind } = channel;
    const norm = Math.sqrt(((2 * l + 1) / (4 * Math.PI)) * factorial(l - m) / factorial(l + m));
    const p = associatedLegendre(l, m, Math.cos(theta));
    if (m === 0) return norm * p;
    return Math.sqrt(2) * norm * p * (kind === 'c' ? Math.cos(m * phi) : Math.sin(m * phi));
  }

  const rowH = 19;
  channels.forEach((channel, index) =&gt; {
    const y = 17 + index * rowH;
    if (index &gt; 0 &amp;&amp; channels[index - 1].l !== channel.l) {
      const separator = document.createElementNS(ns, 'line');
      separator.setAttribute('class', 'bh-degree-separator');
      separator.setAttribute('x1', '4');
      separator.setAttribute('x2', '416');
      separator.setAttribute('y1', String(y - 9));
      separator.setAttribute('y2', String(y - 9));
      barsGroup.appendChild(separator);
    }
    const label = document.createElementNS(ns, 'text');
    label.setAttribute('class', 'bh-bar-label');
    label.setAttribute('x', '62');
    label.setAttribute('y', String(y + 4));
    label.setAttribute('text-anchor', 'end');
    label.textContent = channel.label;
    barsGroup.appendChild(label);

    const bar = document.createElementNS(ns, 'rect');
    bar.setAttribute('class', 'bh-bar');
    bar.setAttribute('data-index', String(index));
    bar.setAttribute('y', String(y - 6));
    bar.setAttribute('height', '12');
    bar.setAttribute('rx', '2');
    barsGroup.appendChild(bar);

    const value = document.createElementNS(ns, 'text');
    value.setAttribute('class', 'bh-bar-value');
    value.setAttribute('data-index', String(index));
    value.setAttribute('y', String(y + 4));
    barsGroup.appendChild(value);
  });

  const fmt = value =&gt; `${value &gt;= 0 ? '+' : ''}${value.toFixed(3)}`;

  function update() {
    const thetaDeg = Number(thetaInput.value);
    const phiDeg = Number(phiInput.value);
    const theta = thetaDeg * Math.PI / 180;
    const phi = phiDeg * Math.PI / 180;
    const x = Math.sin(theta) * Math.cos(phi);
    const y = Math.sin(theta) * Math.sin(phi);
    const z = Math.cos(theta);

    thetaValue.textContent = `${thetaDeg}°`;
    phiValue.textContent = `${phiDeg}°`;
    xyzText.textContent = `X = ${fmt(x)} · Y = ${fmt(y)} · Z = ${fmt(z)}`;

    const px = 165 + 110 * x + 45 * y;
    const py = 165 - 110 * z + 31 * y;
    vector.setAttribute('x2', px.toFixed(2));
    vector.setAttribute('y2', py.toFixed(2));
    point.setAttribute('cx', px.toFixed(2));
    point.setAttribute('cy', py.toFixed(2));

    channels.forEach((channel, index) =&gt; {
      const val = realY(channel, theta, phi);
      const scaled = val * 210;
      const bar = barsGroup.querySelector(`.bh-bar[data-index=&quot;${index}&quot;]`);
      const valueLabel = barsGroup.querySelector(`.bh-bar-value[data-index=&quot;${index}&quot;]`);
      bar.setAttribute('x', String(scaled &gt;= 0 ? 205 : 205 + scaled));
      bar.setAttribute('width', String(Math.abs(scaled)));
      valueLabel.setAttribute('x', String(scaled &gt;= 0 ? Math.min(382, 211 + scaled) : Math.max(72, 199 + scaled)));
      valueLabel.setAttribute('text-anchor', scaled &gt;= 0 ? 'start' : 'end');
      valueLabel.textContent = fmt(val);
    });
  }

  thetaInput.addEventListener('input', update);
  phiInput.addEventListener('input', update);
  update();
})();
&lt;/script&gt;
